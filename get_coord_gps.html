<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Géocodage Google Maps</title>
</head>
<body>

  <h1>Recherche de coordonnées GPS (Google Maps API)</h1>
  
  <!-- Champ pour saisir l'adresse -->
  <input type="text" id="addressInput" 
         placeholder="Entrez une adresse (ex : 10 rue de la Paix, Paris)" 
         style="width: 300px;" />
  <button id="geoBtn">Géocoder</button>
  
  <!-- Zone d'affichage du résultat -->
  <div id="result" style="margin-top: 10px; font-weight: bold;"></div>

 

</body>
</html>
